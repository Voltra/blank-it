[package]
name = "blank-it"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
dialoguer = "0.12.0"
env_logger = {  version = "0.11.11", features = ["default"] }
exitcode = "1.1.2"
indicatif = { version = "0.18.6", features = ["default", "improved_unicode", "in_memory"] }
indicatif-log-bridge = "0.2.3"
log = { version = "0.4.34", features = ["alloc"] }
tracing = { version = "0.1.44", features = ["default", "std"] }
tracing-indicatif = "0.3.14"
